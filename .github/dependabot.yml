# Version updates as pull requests, checked by CI like any other. Minor and
# patch updates arrive grouped in one pull request a week; a major update
# gets its own, since it may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 waits for typescript-eslint, which requires < 6.1 (brief,
      # section 5). Remove this entry when it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The major of @types/node follows the Node major in .nvmrc: both move
      # together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
