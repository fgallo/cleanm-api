name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway database that only exists inside this job. Not a secret.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleanm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cleanm_ci
      # The tests use the same throwaway database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cleanm_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Invoice PDFs are rendered by Chromium, which puppeteer downloads on
      # install (~170 MB); keep it between runs.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
